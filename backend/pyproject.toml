[project]
name = "filigree"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2",
    "uvicorn>=0.54.0",
]

[project.scripts]
filigree = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]  # ponytail: the top-level package is called "app"; rename to "filigree" before publishing to PyPI

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"
